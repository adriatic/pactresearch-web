name: CI

on: push

# The integration job takes minutes, not seconds, and `on: push` fires
# for every commit. Without this, pushing three times in a row leaves
# three full database stacks grinding away on superseded commits. Only
# the newest push per branch is worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Task 66. next.config.ts refuses to build, and refuses to run
# `next typegen`, without the variables the app genuinely requires --
# the gate that was missing when API_KEY_ENCRYPTION_SECRET was deleted
# from Vercel on 2026-09-27 and the deploy went live anyway.
#
# CI has to satisfy that gate to typecheck at all, so these are set
# here, at workflow level, with throwaway values. They are NOT
# credentials: the Supabase pair is Supabase's own fixed local-dev
# demo pair, published in .env.local.example, and the encryption
# secret is 32 bytes of a constant for a database this job creates and
# destroys.
#
# CI cannot verify production's environment -- nothing here knows what
# Vercel holds. What it does verify is that the gate is wired and
# passes, and the "environment gate fails loudly" step below proves it
# can still fail. The unit tests cover the logic itself.
env:
  NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
  API_KEY_ENCRYPTION_SECRET: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM="

jobs:
  # Fast feedback: no Docker, no database, finishes in well under a
  # minute. Kept as its own job so a lint error is never buried behind a
  # ten-minute integration run, and so the two failures are told apart
  # at a glance in the checks list.
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run typecheck` runs `next typegen` first, deliberately, so
      # this step needs nothing extra here. See the note in package.json:
      # the generated route types are gitignored, so a fresh checkout has
      # none, and a CI-only typegen step would leave the same local/CI
      # divergence that let this break unnoticed for a week of merges.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Proves the gate can still FAIL, not just pass. Every other step
      # in this job runs with the variables present, so without this a
      # gate that had been silently removed would look identical to a
      # gate that works.
      #
      # `next typegen` is the cheapest command that loads next.config.ts
      # (a full build would take minutes to prove the same thing).
      - name: Environment gate fails loudly on a missing variable
        env:
          API_KEY_ENCRYPTION_SECRET: ""
        run: |
          set +e
          output=$(npx next typegen 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::next typegen succeeded with API_KEY_ENCRYPTION_SECRET unset -- the environment gate is not running."
            exit 1
          fi
          if ! echo "$output" | grep -q "Missing required environment variable: API_KEY_ENCRYPTION_SECRET"; then
            echo "::error::The gate failed, but not with the message that names the variable."
            exit 1
          fi
          echo "Gate failed as intended, naming the variable."

  # Task 57. The integration suite, against a real local Supabase.
  #
  # WHY THIS EXISTS. These 94 tests were running on nobody's machine but
  # a developer's. Task 55b found 11 of them failing, and they had been
  # failing for some time -- `after` was called outside a request scope,
  # broken since task 42 -- because nothing ran them automatically. A
  # suite outside CI is not a guard, it is a suite someone remembers to
  # run.
  #
  # No supabase/setup-cli action: the CLI is already a devDependency, so
  # `npm ci` installs it and `npx supabase` resolves to that exact
  # pinned version -- the same one used locally. One less moving part,
  # and no chance of CI and a developer running different CLI versions.
  #
  # SCOPE, DECIDED 2026-09-28 (Nik) -- recorded here so it is not
  # re-litigated from first principles every time this job feels slow:
  #
  #   - E2E stays MANUAL and is deliberately not added to this job. It
  #     needs this same stack plus a production build and a browser
  #     install on every run.
  #
  #   - If this job's ~10 minutes per push proves too slow, the answer
  #     is to SPLIT THE SUITE -- not to restrict it to main and pull
  #     requests. Restricting the triggers would mean feature branches
  #     stop being checked at all, which is the situation task 57
  #     existed to end.
  #
  # ubuntu-latest ships Docker, which is all `supabase start` needs.
  # Every service is started rather than a trimmed subset: the suite
  # touches Realtime (responses-realtime) and Storage (prompt-image
  # cleanup in the execute path), and guessing wrong about which
  # services are needed buys a couple of minutes at the cost of a
  # confusing failure.
  integration:
    runs-on: ubuntu-latest
    # Generous: `supabase start` pulls images on a cold runner, and the
    # suite itself resets the database per file (fileParallelism is off
    # deliberately, so one file's reset cannot wipe another's data).
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        run: npx supabase start

      # API_KEY_ENCRYPTION_SECRET comes from the workflow-level env
      # above. The tests set it themselves where they need a specific
      # value, but several assume a usable secret is present before they
      # start, and inheriting it means the suite never depends on a
      # developer's .env.local -- the exact local/CI divergence that hid
      # the 2026-09-27 outage, where decryption worked locally and
      # failed in production because only one of them had the variable.
      - name: Integration tests
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
